[package]
name = "taro-enterprise-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Taro Enterprise Setup Wizard: a local, loopback-only web wizard that bootstraps a Taro Enterprise deployment"
publish = false

[[bin]]
name = "taro-enterprise-setup"
path = "src/main.rs"

[lib]
name = "taro_enterprise_setup"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "http2"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
regex = "1"
base64 = "0.22"
getrandom = "0.3"
zeroize = "1"
crypto_box = { version = "0.9", features = ["seal", "std"] }
subtle = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "test-util"] }
tower = { version = "0.5", features = ["util"] }
