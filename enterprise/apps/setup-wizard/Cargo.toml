[package]
name = "taro-enterprise-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Taro Enterprise package builder (Wizard 1): a Windows app (WebView2 window over a loopback-only local server) that assembles a provider's branded Taro packages from the signed, version-pinned official artifacts"
publish = false

[[bin]]
name = "taro-enterprise-setup"
path = "src/main.rs"

[lib]
name = "taro_enterprise_setup"
path = "src/lib.rs"

[dependencies]
rm-brand = { path = "../../../crates/rm-brand" }
taro-update = { path = "../../crates/taro-update" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
regex = "1"
getrandom = "0.3"
zeroize = "1"
subtle = "2"
sha2 = "0.10"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
base64 = "0.22"
# GitHub Actions secrets are libsodium sealed boxes
crypto_box = { version = "0.9", features = ["seal", "std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_Security_Cryptography",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# the app window: a native window with the pages in WebView2 (part of Windows 10/11)
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "test-util"] }
tower = { version = "0.5", features = ["util"] }
futures-util = { version = "0.3", default-features = false }
