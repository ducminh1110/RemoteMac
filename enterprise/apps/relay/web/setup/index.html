<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay setup</title>
<link rel="stylesheet" href="/common/console.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/brand/tokens.css">
<link rel="stylesheet" href="/brand/theme.css">
<script type="module" src="/assets/app.js"></script>
</head>
<body>
<header class="topnav">
  <span class="brand"><img src="/brand/logo.png" alt="" width="28" height="28"><span id="product">Taro</span></span>
  <span class="service">Relay setup</span>
  <span class="spacer"></span>
  <span class="item hide-sm" id="host" hidden><span class="i i-server" aria-hidden="true"></span><strong id="host-name"></strong></span>
  <span class="badge" id="mode" hidden></span>
  <span class="divider hide-sm"></span>
  <span class="item hide-sm" id="version"></span>
</header>
<div class="layout">
  <nav class="sidenav" aria-label="Setup steps">
    <div class="head">
      <p class="title">Configure relay</p>
      <p class="sub">Wizard 2 · first-run setup</p>
    </div>
    <ol class="wizard-steps" id="steps"></ol>
    <div class="foot" id="side-foot"></div>
  </nav>
  <main class="content" id="main" tabindex="-1">
    <div class="inner"><p class="loading"><span class="spinner" aria-hidden="true"></span>Loading…</p></div>
  </main>
</div>
</body>
</html>
