[package]
name = "taro-enterprise"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Taro Enterprise API: identity, tenancy, rentals, provisioning, billing, ops"

[[bin]]
name = "taro-enterprise"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
hmac = "0.12"
jsonwebtoken = "9"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "builder", "webpki-roots", "ring"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tower = "0.5.3"
tower-http = { version = "0.6", features = ["trace", "set-header", "limit", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
webpki-roots = "0.26"
x509-parser = "0.16"

[dev-dependencies]
http-body-util = "0.1.5"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tower = { version = "0.5.3", features = ["util"] }
