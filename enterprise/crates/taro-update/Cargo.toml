[package]
name = "taro-update"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Taro Enterprise releases: signed manifests, enterprise-update.zip (pack and controlled apply), component manifests"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "taro-update"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml_edit = "0.22"
zip = { version = "9", default-features = false, features = ["deflate"] }
