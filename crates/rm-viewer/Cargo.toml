[package]
name = "rm-viewer"
version.workspace = true
edition.workspace = true

[lib]
name = "rm_viewer"

[[bin]]
name = "remote-mac-viewer"
path = "src/main.rs"

[dependencies]
rm-protocol = { path = "../rm-protocol" }
rm-client = { path = "../rm-client" }
rm-relay = { path = "../rm-relay" }
rm-decode = { path = "../rm-decode" }
moonlight-sys = { path = "../moonlight-sys" }
rm-gamestream = { path = "../rm-gamestream" }
serde_json.workspace = true
rustybuzz = "0.20"
ab_glyph_rasterizer = "0.1"
sha2 = "0.10"

[build-dependencies]
# compiles build.rs's version resource with rc.exe (MSVC) or windres (GNU); nothing elsewhere
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_Xps",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_UI_Controls",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_DirectComposition",
  "Win32_Media",
  "Win32_Media_MediaFoundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Registry",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_Networking_WinHttp",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_Kernel",
  "Foundation",
  "Foundation_Numerics",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "UI_Composition",
  "UI_Composition_Desktop",
  "System",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
]

[dev-dependencies]
rm-fakeagent = { path = "../rm-fakeagent" }
openh264 = "0.9"
