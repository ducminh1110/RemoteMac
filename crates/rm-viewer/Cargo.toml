[package]
name = "rm-viewer"
version.workspace = true
edition.workspace = true

[lib]
name = "rm_viewer"

[[bin]]
name = "remote-mac-viewer"
path = "src/main.rs"

[dependencies]
rm-protocol = { path = "../rm-protocol" }
rm-client = { path = "../rm-client" }
rm-relay = { path = "../rm-relay" }
rm-decode = { path = "../rm-decode" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_Xps",
]

[dev-dependencies]
rm-fakeagent = { path = "../rm-fakeagent" }
