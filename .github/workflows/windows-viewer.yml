name: Windows viewer

# Builds the native Win32 viewer and runs its smoke test against the scripted fake agent.
on:
  workflow_dispatch:
  push:
    branches: [claude/inspiring-einstein-er2d37]
    paths: [crates/**, scripts/windows-smoke.ps1, scripts/windows-showcase.ps1, scripts/windows-branded.ps1, .github/workflows/windows-viewer.yml, Cargo.*]

permissions:
  contents: read

jobs:
  viewer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (portable crates, incl. fake-agent end-to-end)
        run: cargo test --workspace
      - name: Clippy (Windows target)
        run: cargo clippy -p rm-viewer --all-targets -- -D warnings
      - name: Smoke test the native viewer
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - name: A provider's Taro, branded (Acme Connect, its relay and key from provider.json)
        shell: pwsh
        run: ./scripts/windows-branded.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branded-client-screenshots
          path: |
            out/branded-client/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-viewer-logs
          path: |
            out/*.log
            out/showcase-fake/*
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: remote-mac-viewer-windows-x64
          path: |
            target/release/remote-mac-viewer.exe
            target/release/rm-relay.exe
