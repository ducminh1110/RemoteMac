name: Enterprise
# Taro Enterprise (enterprise/): format, lint, tests against Postgres, migrations, the web apps'
# scripts, dependency and secret scanning, the container image and TaroEnterpriseSetup.exe.
on:
  push:
    paths: ["enterprise/**", "crates/rm-relay/**", "crates/rm-brand/**", ".github/workflows/enterprise.yml", ".github/workflows/enterprise-release.yml"]
  pull_request:
    paths: ["enterprise/**", "crates/rm-relay/**", "crates/rm-brand/**", ".github/workflows/enterprise.yml", ".github/workflows/enterprise-release.yml"]
permissions:
  contents: read
defaults:
  run:
    working-directory: enterprise
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TARO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # the database tests must run here, never skip
      TARO_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      # only the enterprise packages (--all would also reach the Taro crates they depend on)
      - run: cargo fmt --check -p taro-enterprise -p taro-enterprise-setup -p taro-update -p taro-relay
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Migrations apply to an empty database, and again (idempotent)
        env:
          TARO_ENV: development
          TARO_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          cargo run -q --locked -p taro-enterprise -- migrate
          cargo run -q --locked -p taro-enterprise -- migrate
          cargo run -q --locked -p taro-enterprise -- check-config
      - name: Production configuration is refused without its secrets
        env:
          TARO_ENV: production
          TARO_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          if cargo run -q --locked -p taro-enterprise -- check-config; then echo "production started without TARO_SECRET_KEY/https/SMTP"; exit 1; fi

  relay-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked -p taro-relay -p taro-update
      - name: The relay package installs, refuses a second install, recovers
        run: scripts/test-relay-package.sh target/release/taro-relay
      - name: enterprise-update.zip is built from it, signed, and holds only approved core files
        run: |
          set -euo pipefail
          k=$(target/release/taro-update keygen)
          export TARO_ENTERPRISE_SIGNING_KEY=$(echo "$k" | sed -n 's/^secret.*: //p')
          echo "$k" | sed -n 's/^public.*: //p' > test.pub
          # a key the repository does not trust is refused for signing
          if target/release/taro-update check-key 2>/dev/null; then echo "signed with a key not in release-signing.pub"; exit 1; fi
          export TARO_UPDATE_TRUST=test.pub
          v=$(target/release/taro-relay version | awk '{print $2}')
          p=$(scripts/package-relay.sh "$v" "$(uname -m)" target/release/taro-relay pk | tail -1)
          scripts/build-enterprise-update.sh "$v" out "$p"
          target/release/taro-update inspect out/enterprise-update.zip --keys test.pub > inspect.txt
          head -3 inspect.txt
          # the official key does not accept a package signed by another
          if target/release/taro-update inspect out/enterprise-update.zip >/dev/null 2>&1; then echo "accepted a package not signed by the release key"; exit 1; fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every script parses as an ES module
        run: |
          for f in $(find apps/customer-portal apps/provider-console apps/setup-wizard/assets -name '*.js' -not -path '*/node_modules/*' -not -path '*/tests/*' 2>/dev/null); do
            node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }
          done
      - name: No inline scripts, styles or handlers (the CSP refuses them)
        run: |
          if grep -RInE '<script>|<script [^>]*>[^<]|style="|on(click|load|error|submit|input|change)=' --include='*.html' apps/customer-portal apps/provider-console apps/setup-wizard/assets 2>/dev/null; then exit 1; fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny unsound --deny yanked

  secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: enterprise/.gitleaks.toml

  image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t taro-enterprise:ci -f enterprise/Dockerfile .
      - name: It starts and answers its health check
        run: |
          docker network create taro
          docker run -d --name db --network taro -e POSTGRES_PASSWORD=pw postgres:16
          for i in $(seq 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name api --network taro -p 18080:8080 -e TARO_ENV=development -e TARO_LISTEN=0.0.0.0:8080 \
            -e TARO_DATABASE_URL=postgres://postgres:pw@db:5432/postgres taro-enterprise:ci
          for i in $(seq 60); do curl -fsS http://127.0.0.1:18080/readyz && exit 0; sleep 1; done
          docker logs api; exit 1

  setup-wizard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked -p taro-enterprise-setup
      - run: Copy-Item target/release/taro-enterprise-setup.exe TaroEnterpriseSetup.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: TaroEnterpriseSetup
          path: enterprise/TaroEnterpriseSetup.exe
