name: Temporary RemoteMac Mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: Temporary macOS RemoteMac
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Download RemoteMac macOS artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/remotemac"
          cd "$RUNNER_TEMP/remotemac"

          gh run download 37101469873 \
            --repo "${{ github.repository }}" \
            --name remotemac-macos

          test -f remotemac-macos.tar.gz

          echo ""
          echo "Downloaded RemoteMac:"
          ls -lh remotemac-macos.tar.gz

      - name: Extract RemoteMac
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/remotemac"

          tar -xzf remotemac-macos.tar.gz

          test -f remotemac/remotemac

          chmod +x remotemac/remotemac

          xattr -d com.apple.quarantine \
            remotemac/remotemac \
            2>/dev/null || true

          echo ""
          echo "RemoteMac binary:"
          ls -lh remotemac/remotemac

      - name: Generate password
        shell: bash
        run: |
          set -euo pipefail

          PASSWORD="$(openssl rand -hex 16)"

          echo "RM_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo " RemoteMac Connection"
          echo "========================================"
          echo "Password: $PASSWORD"
          echo "Relay:    remotemac.mooo.com:7470"
          echo "========================================"
          echo ""

      - name: Show Mac information
        shell: bash
        run: |
          set -euo pipefail

          echo "Machine:"
          scutil --get ComputerName || hostname

          echo ""
          echo "Hostname:"
          hostname

          echo ""
          echo "macOS:"
          sw_vers -productVersion

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "Runner:"
          echo "$RUNNER_NAME"

          echo ""
          echo "Relay:"
          echo "remotemac.mooo.com:7470"

      - name: Start RemoteMac
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/remotemac/remotemac"

          LOG="$RUNNER_TEMP/remotemac.log"

          : > "$LOG"

          echo "Starting RemoteMac..."

          ./remotemac \
            --password "$RM_PASSWORD" \
            > "$LOG" 2>&1 &

          PID=$!

          echo "$PID" > "$RUNNER_TEMP/remotemac.pid"

          sleep 5

          echo ""
          echo "========== RemoteMac startup log =========="
          cat "$LOG" || true
          echo "==========================================="
          echo ""

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "RemoteMac exited during startup."

            echo ""
            echo "Full log:"
            cat "$LOG" || true

            exit 1
          fi

          sleep 2

          echo ""
          echo "========== RemoteMac log =========="
          cat "$LOG" || true
          echo "===================================="
          echo ""

          DISPLAY_ID="$(
            grep -Eim1 \
              'ID session to connect:[[:space:]]*[0-9][0-9 ]*' \
              "$LOG" \
              | sed -E \
                's/.*ID session to connect:[[:space:]]*([0-9 ]+).*/\1/'
          )"

          if [ -z "${DISPLAY_ID:-}" ]; then
            echo ""
            echo "ERROR: Could not find RemoteMac session ID."
            echo ""
            echo "Expected:"
            echo "  ID session to connect: 293 430 115"
            echo ""
            echo "Full RemoteMac log:"
            cat "$LOG" || true
            exit 1
          fi

          # Convert:
          # 293 430 115
          # into:
          # 293430115

          DISPLAY_ID="$(echo "$DISPLAY_ID" | tr -d '[:space:]')"

          SESSION_ID="rm-$DISPLAY_ID"

          echo "RM_DISPLAY_ID=$DISPLAY_ID" >> "$GITHUB_ENV"
          echo "RM_SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo " RemoteMac READY"
          echo "========================================"
          echo "ID:       $DISPLAY_ID"
          echo "Session:  $SESSION_ID"
          echo "Password: $RM_PASSWORD"
          echo "Relay:    remotemac.mooo.com:7470"
          echo "PID:      $PID"
          echo "========================================"
          echo ""

      - name: Keep Mac online
        shell: bash
        run: |
          set -euo pipefail

          PID="$(cat "$RUNNER_TEMP/remotemac.pid")"

          echo ""
          echo "========================================"
          echo " RemoteMac session is active"
          echo "========================================"
          echo "ID:       $RM_DISPLAY_ID"
          echo "Session:  $RM_SESSION_ID"
          echo "Password: $RM_PASSWORD"
          echo "Relay:    remotemac.mooo.com:7470"
          echo "========================================"
          echo ""

          while true; do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo ""
              echo "RemoteMac stopped unexpectedly."
              echo ""

              echo "========== RemoteMac log =========="
              cat "$RUNNER_TEMP/remotemac.log" || true
              echo "==================================="

              exit 1
            fi

            sleep $((5 + RANDOM % 6))

            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] RemoteMac alive"
            echo "ID=$RM_DISPLAY_ID"
            echo "Session=$RM_SESSION_ID"
          done

      - name: Stop RemoteMac
        if: always()
        shell: bash
        run: |
          echo "Stopping RemoteMac..."

          if [ -f "$RUNNER_TEMP/remotemac.pid" ]; then
            PID="$(cat "$RUNNER_TEMP/remotemac.pid")"

            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID" 2>/dev/null || true
            fi
          fi

          echo ""
          echo "========== Final RemoteMac log =========="
          cat "$RUNNER_TEMP/remotemac.log" 2>/dev/null || true
          echo "========================================="
