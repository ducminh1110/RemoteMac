name: Temporary RemoteMac Mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: Temporary macOS RemoteMac
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Download RemoteMac macOS artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/remotemac"
          cd "$RUNNER_TEMP/remotemac"

          gh run download 37036138637 \
            --repo "${{ github.repository }}" \
            --name remotemac-macos

          test -f remotemac-macos.tar.gz

          echo "Downloaded:"
          ls -lh remotemac-macos.tar.gz

      - name: Extract RemoteMac
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/remotemac"

          tar -xzf remotemac-macos.tar.gz

          test -f remotemac/remotemac

          chmod +x remotemac/remotemac

          xattr -d com.apple.quarantine \
            remotemac/remotemac \
            2>/dev/null || true

      - name: Generate password
        shell: bash
        run: |
          set -euo pipefail

          PASSWORD="$(openssl rand -hex 16)"

          echo "RM_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo " RemoteMac Connection"
          echo "========================================"
          echo "Password: $PASSWORD"
          echo "Relay:    remotemac.mooo.com:7470"
          echo "========================================"
          echo ""

      - name: Show Mac information
        shell: bash
        run: |
          set -euo pipefail

          echo "Machine:"
          scutil --get ComputerName || hostname

          echo ""
          echo "Hostname:"
          hostname

          echo ""
          echo "macOS:"
          sw_vers -productVersion

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "Runner:"
          echo "$RUNNER_NAME"

          echo ""
          echo "Relay:"
          echo "remotemac.mooo.com:7470"

      - name: Start RemoteMac
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/remotemac/remotemac"

          LOG="$RUNNER_TEMP/remotemac.log"

          : > "$LOG"

          echo "Starting RemoteMac..."

          ./remotemac \
            --password "$RM_PASSWORD" \
            > "$LOG" 2>&1 &

          PID=$!

          echo "$PID" > "$RUNNER_TEMP/remotemac.pid"

          sleep 5

          echo ""
          echo "========== RemoteMac startup log =========="
          cat "$LOG" || true
          echo "============================================"
          echo ""

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "RemoteMac exited during startup."
            exit 1
          fi

          # Give the agent a little more time to print its ID.
          sleep 2

          echo ""
          echo "========== RemoteMac log =========="
          cat "$LOG" || true
          echo "===================================="
          echo ""

          # Accept common forms:
          # ID: xxx
          # Id: xxx
          # id: xxx
          # Session: xxx
          ID="$(
            grep -Eim1 '^[[:space:]]*(ID|Id|id|Session)[[:space:]]*:' "$LOG" \
            | sed -E 's/^[[:space:]]*(ID|Id|id|Session)[[:space:]]*:[[:space:]]*//'
          )"

          # Fallback: try an "ID =" form.
          if [ -z "${ID:-}" ]; then
            ID="$(
              grep -Eim1 '^[[:space:]]*(ID|Id|id|Session)[[:space:]]*=' "$LOG" \
              | sed -E 's/^[[:space:]]*(ID|Id|id|Session)[[:space:]]*=[[:space:]]*//'
            )"
          fi

          if [ -z "${ID:-}" ]; then
            echo ""
            echo "ERROR: Could not find the RemoteMac ID in the agent output."
            echo ""
            echo "Full log:"
            cat "$LOG"
            echo ""
            echo "The agent is running, but its ID format was not recognized."
            exit 1
          fi

          ID="$(echo "$ID" | tr -d '\r' | xargs)"

          echo "RM_MACHINE_ID=$ID" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo " RemoteMac READY"
          echo "========================================"
          echo "ID:       $ID"
          echo "Password: $RM_PASSWORD"
          echo "Relay:    remotemac.mooo.com:7470"
          echo "PID:      $PID"
          echo "========================================"
          echo ""

      - name: Keep Mac online
        shell: bash
        run: |
          set -euo pipefail

          PID="$(cat "$RUNNER_TEMP/remotemac.pid")"

          echo ""
          echo "========================================"
          echo " RemoteMac session is active"
          echo "========================================"
          echo "ID:       $RM_MACHINE_ID"
          echo "Password: $RM_PASSWORD"
          echo "Relay:    remotemac.mooo.com:7470"
          echo "========================================"
          echo ""

          while true; do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo ""
              echo "RemoteMac stopped unexpectedly."
              echo ""
              echo "========== RemoteMac log =========="
              cat "$RUNNER_TEMP/remotemac.log" || true
              exit 1
            fi

            sleep $((5 + RANDOM % 6))

            echo "[$(date '+%Y-%m-%d %H:%M:%S')] RemoteMac alive"
            echo "ID=$RM_MACHINE_ID"
          done

      - name: Stop RemoteMac
        if: always()
        shell: bash
        run: |
          echo "Stopping RemoteMac..."

          if [ -f "$RUNNER_TEMP/remotemac.pid" ]; then
            PID="$(cat "$RUNNER_TEMP/remotemac.pid")"

            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID" 2>/dev/null || true
            fi
          fi

          echo ""
          echo "========== Final RemoteMac log =========="
          cat "$RUNNER_TEMP/remotemac.log" 2>/dev/null || true
