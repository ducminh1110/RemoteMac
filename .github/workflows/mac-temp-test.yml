name: Temporary RemoteMac macOS Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-environment:
    name: RemoteMac macOS Runner
    runs-on: macos-15
    timeout-minutes: 360

    env:
      RM_RELAY_HOST: remotemac.mooo.com:7470
      RM_SESSION_ID: github-mac-${{ github.run_id }}
      RM_RELAY_KEY: ${{ secrets.RM_RELAY_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install openssl || true

      - name: Show Mac information
        run: |
          echo "=============================="
          echo " RemoteMac Temporary Mac"
          echo "=============================="
          echo "Machine:"
          scutil --get ComputerName || hostname

          echo "macOS:"
          sw_vers

          echo "Architecture:"
          uname -m

          echo "Runner:"
          echo "$RUNNER_NAME"

          echo "Session:"
          echo "$RM_SESSION_ID"

          echo "Relay:"
          echo "$RM_RELAY_HOST"

          echo "=============================="

      - name: Generate session token
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(openssl rand -hex 16)

          echo "RM_SESSION_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          echo ""
          echo "=============================="
          echo " RemoteMac Connection Info"
          echo "=============================="
          echo "Session ID:"
          echo "$RM_SESSION_ID"

          echo "Session Token:"
          echo "$TOKEN"

          echo "Relay:"
          echo "$RM_RELAY_HOST"

          echo "=============================="

      - name: Check relay connectivity
        run: |
          set -eux

          echo "DNS:"
          dig +short remotemac.mooo.com

          echo "TCP:"
          nc -vz -w 10 remotemac.mooo.com 7470

      - name: Build macOS agent
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./scripts/build-agent-macos.sh

          ./scripts/build-agent-macos.sh

          ls -lah out/

      - name: Start RemoteMac agent
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RM_RELAY_KEY:-}" ]; then
            echo "Missing RM_RELAY_KEY"
            exit 1
          fi

          export RM_SESSION_TOKEN="$RM_SESSION_TOKEN"
          export RM_RELAY_KEY="$RM_RELAY_KEY"

          echo "Starting RemoteMac agent"

          ./out/remote-agent-mac \
            --relay "$RM_RELAY_HOST" \
            --session "$RM_SESSION_ID" \
            > "$RUNNER_TEMP/remote-agent.log" 2>&1 &

          PID=$!

          echo "$PID" > "$RUNNER_TEMP/agent.pid"

          sleep 5

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "Agent exited"
            cat "$RUNNER_TEMP/remote-agent.log"
            exit 1
          fi

          echo "Agent running"
          echo "PID=$PID"

      - name: Show agent startup log
        if: always()
        run: |
          sleep 3
          echo "========== Agent log =========="
          cat "$RUNNER_TEMP/remote-agent.log" || true


      - name: Keep Mac session alive
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "================================"
          echo " RemoteMac READY"
          echo "================================"

          echo "Machine:"
          scutil --get ComputerName || hostname

          echo "Session:"
          echo "$RM_SESSION_ID"

          echo "Relay:"
          echo "$RM_RELAY_HOST"

          echo ""
          echo "Use:"
          echo ""
          echo "RM_SESSION_TOKEN=$RM_SESSION_TOKEN"
          echo ""

          while true; do

            if [ -f "$RUNNER_TEMP/agent.pid" ]; then

              PID=$(cat "$RUNNER_TEMP/agent.pid")

              if ! kill -0 "$PID" 2>/dev/null; then
                echo "Agent stopped"
                cat "$RUNNER_TEMP/remote-agent.log"
                exit 1
              fi

            fi


            WAIT=$((5 + RANDOM % 6))

            sleep "$WAIT"

            echo "[$(date)] RemoteMac alive"
            echo "Session=$RM_SESSION_ID"

          done


      - name: Cleanup
        if: always()
        shell: bash
        run: |

          echo "Stopping agent"

          if [ -f "$RUNNER_TEMP/agent.pid" ]; then

            PID=$(cat "$RUNNER_TEMP/agent.pid")

            kill "$PID" || true

          fi


          echo "========== Final agent log =========="
          cat "$RUNNER_TEMP/remote-agent.log" || true
