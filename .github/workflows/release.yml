name: Release builds

# What a user downloads:
#   Taro-Setup.exe      Taro for Windows, installed for this user (it updates itself from here)
#   Taro-windows.zip    the same Taro.exe without installing
#   Taro-macos.tar.gz   the Mac app (universal: Apple silicon + Intel):  ./taro --password PASS,
#                       updated in place with ./taro-update.sh
#   taro-relay.tar.gz   the relay server + remotemac-relay-setup.sh (installs it from A to Z)
# The source has no relay in it. These builds get one built in: the repository variable
# RM_DEFAULT_RELAY (host:port), and on the official repository remotemac.mooo.com:7470; the
# relay's admission key comes from the RM_RELAY_KEY secret. A version tag (1.0.0 or v1.0.0)
# runs the tests, builds all three and publishes them as a GitHub release; so does running this
# workflow by hand with a version (the tag is then created on the commit it ran on).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this version (e.g. 1.0.0); empty: build only"
        required: false
        default: ""
  push:
    branches: [claude/inspiring-einstein-er2d37]
    tags: ['v*', '[0-9]*']
    paths: [agent/**, crates/**, deploy/**, installer/**, scripts/build-agent-macos.sh, .github/workflows/release.yml, Cargo.*]

env:
  DEFAULT_RELAY: ${{ vars.RM_DEFAULT_RELAY || (github.repository == 'ducminh1110/RemoteMac' && 'remotemac.mooo.com:7470' || '') }}

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build universal remotemac
        env:
          RM_BUILD_RELAY_KEY: ${{ secrets.RM_RELAY_KEY }}
          RM_BUILD_DEFAULT_RELAY: ${{ env.DEFAULT_RELAY }}
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            RM_SWIFT_TARGET=$arch-apple-macos14.0 ./scripts/build-agent-macos.sh
            mv out/remote-agent-mac out/remotemac-$arch
          done
          rm -f out/BuildConfig.swift
          mkdir -p dist/Taro
          lipo -create out/remotemac-arm64 out/remotemac-x86_64 -output dist/Taro/taro
          codesign --force -s - dist/Taro/taro
          lipo -info dist/Taro/taro
          dist/Taro/taro --help
          install -m 0755 agent/macos/taro.sh dist/Taro/taro.sh
          install -m 0755 agent/macos/taro-update.sh dist/Taro/taro-update.sh
          bash -n dist/Taro/taro-update.sh
          cat > dist/Taro/README.txt <<'TXT'
          Taro for macOS (14 or later, Apple silicon and Intel)

            xattr -d com.apple.quarantine taro 2>/dev/null; chmod +x taro
            ./taro.sh --password YOUR-PASSWORD

          taro.sh checks the program, macOS and the permissions first, says what is
          missing and how to allow it, then starts taro (./taro works as well;
          ./taro.sh --check only checks).

          It prints the ID and the password, then keeps running in the background
          (also after the terminal is closed). Type both into Taro.exe on Windows.
          The ID stays the same on this Mac. Stop it with: ./taro --stop
          Connections are end-to-end encrypted. No log is written unless you add
          --logs-enabled (log: ~/Library/Logs/Taro/taro.log).
          On the same network the PC finds this Mac by its ID and connects straight to it;
          from elsewhere it goes through the relay built into this build
          (another one: ./taro --relay HOST:PORT --password ...).
          First run: allow Terminal in System Settings > Privacy & Security >
          Screen Recording and Accessibility, then run the command again.
          Without --password a random password is shown. --foreground keeps it in the
          terminal (Ctrl+C stops it). All options: ./taro --help

          Updating: ./taro-update.sh fetches the newest Taro from its releases on
          GitHub, checks it and puts it in place of this one (./taro-update.sh --check
          only says whether there is one). A Taro running in the background goes on
          with the new version by itself, with the same ID and password.
          TXT
          sed -i '' 's/^          //' dist/Taro/README.txt
          tar -C dist -czf dist/Taro-macos.tar.gz Taro
      - name: taro-update.sh fetches, checks and puts a release in place
        run: |
          set -uo pipefail
          # this build against the newest release: up to date (0) or a newer one there (10)
          dist/Taro/taro-update.sh --check; rc=$?
          [[ $rc == 0 || $rc == 10 ]] || { echo "--check failed ($rc)"; exit 1; }
          # a copy of the folder takes the newest release in place of this build
          t="$RUNNER_TEMP/taro-copy"; rm -rf "$t"; cp -R dist/Taro "$t"
          "$t/taro-update.sh" --force || { echo "the update failed"; exit 1; }
          want="$(curl -fsSI https://github.com/${{ github.repository }}/releases/latest | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}' | sed 's|.*/tag/||; s|^v||')"
          got="$("$t/taro" --version | awk '{print $2}')"
          echo "newest release: $want; the copy now runs: $got"
          [[ -n "$want" && "$got" == "$want" ]] || { echo "the copy was not updated"; exit 1; }
          [[ -x "$t/taro.sh" ]] || { echo "taro.sh is gone"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Taro-macos
          path: dist/Taro-macos.tar.gz

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Taro.exe
        env:
          RM_RELAY_KEY: ${{ secrets.RM_RELAY_KEY }}
          RM_DEFAULT_RELAY: ${{ env.DEFAULT_RELAY }}
        run: cargo build --release -p rm-viewer
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Taro | Out-Null
          Copy-Item target\release\remote-mac-viewer.exe dist\Taro\Taro.exe
          @"
          Taro for Windows

          1. On the Mac run:  ./taro --password YOUR-PASSWORD
          2. Open Taro.exe, type the ID and the password the Mac shows, press Connect.

          On the same network Taro finds the Mac by its ID and connects straight to it.
          From elsewhere it goes through the relay server shown under "Relay server"
          (this build fills in its own; any other relay can be typed there).

          The Mac's apps open as windows here (and in the Start menu while connected);
          "Mac Desktop" shows the whole Mac screen. The last ID is remembered.
          Connections are end-to-end encrypted. For a log, start Taro.exe --logs-enabled.
          "@ -replace '(?m)^          ', '' | Set-Content dist\Taro\README.txt
          Compress-Archive -Path dist\Taro\* -DestinationPath dist\Taro-windows.zip
      - name: Installer (Taro-Setup.exe), installed and uninstalled once
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $n = ($v -split '-')[0] + '.0'
          # Taro's icon for the installer and its shortcuts
          Start-Process -Wait -FilePath target\release\remote-mac-viewer.exe -ArgumentList '--write-icon', "$PWD\dist\taro.ico"
          if (-not (Test-Path dist\taro.ico)) { throw 'no icon written' }
          $find = { @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null; $iscc = & $find }
          if (-not $iscc) { throw 'Inno Setup not found' }
          & $iscc /Qp "/DAppVersion=$v" "/DNumericVersion=$n" "/DSourceDir=$PWD\dist\Taro" "/DIconFile=$PWD\dist\taro.ico" "/O$PWD\dist" installer\taro.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          # for this user, silently (as an update runs it), then uninstalled
          $dir = Join-Path $env:RUNNER_TEMP 'TaroInstall'
          $p = Start-Process -Wait -PassThru -FilePath dist\Taro-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir"
          if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Taro.lnk'
          if (-not (Test-Path "$dir\Taro.exe")) { throw 'Taro.exe was not installed' }
          if (-not (Test-Path $lnk)) { throw "no Start-menu entry at $lnk" }
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and ((Test-Path "$dir\Taro.exe") -or (Test-Path $lnk)); $i++) { Start-Sleep -Milliseconds 500 }
          if ((Test-Path "$dir\Taro.exe") -or (Test-Path $lnk)) { throw 'the uninstaller left Taro behind' }
          Get-Item dist\Taro-Setup.exe | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Taro-windows
          path: |
            dist/Taro-windows.zip
            dist/Taro-Setup.exe

  relay-bin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static rm-relay (musl)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup target add ${{ matrix.arch }}-unknown-linux-musl
          cargo build --release -p rm-relay --target ${{ matrix.arch }}-unknown-linux-musl
          mkdir -p dist && cp target/${{ matrix.arch }}-unknown-linux-musl/release/rm-relay dist/rm-relay-${{ matrix.arch }}
          file dist/rm-relay-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: rm-relay-${{ matrix.arch }}
          path: dist/rm-relay-${{ matrix.arch }}

  relay:
    needs: relay-bin
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rm-relay-*
          path: bins
          merge-multiple: true
      - name: Package the relay
        env:
          RM_RELAY_KEY: ${{ secrets.RM_RELAY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist/remotemac-relay
          ls bins
          cp bins/rm-relay-* dist/remotemac-relay/
          chmod +x dist/remotemac-relay/rm-relay-*
          # source fallback for other CPUs
          git archive --format=tar.gz -o dist/remotemac-relay/remotemac-src.tar.gz HEAD Cargo.toml Cargo.lock rust-toolchain.toml crates
          python3 - <<'PY'
          import os
          p = "deploy/remotemac-relay-setup.sh"
          s = open(p).read().replace('BUILTIN_KEY="__RM_BUILTIN_KEY__"', 'BUILTIN_KEY="%s"' % os.environ.get("RM_RELAY_KEY", ""), 1)
          open("dist/remotemac-relay/remotemac-relay-setup.sh", "w").write(s)
          PY
          chmod +x dist/remotemac-relay/remotemac-relay-setup.sh
          bash -n dist/remotemac-relay/remotemac-relay-setup.sh
          cat > dist/remotemac-relay/README.txt <<'TXT'
          Taro relay server, Ubuntu / Debian, x86_64 or ARM

            tar -xzf taro-relay.tar.gz && cd remotemac-relay
            sudo ./remotemac-relay-setup.sh --name relay.example.com

          (--name: the DNS name pointing at this server, optional; --key KEY: an
          admission key, optional, then given to the Mac and PC as RM_RELAY_KEY.)

          Installs the relay as a systemd service, opens the port in ufw/iptables,
          checks it and prints the ports to open in your provider's firewall:
            TCP 7470 + UDP 7470 (relay; UDP carries the video) and TCP 22 (SSH).
          Running it again updates the relay.
          TXT
          sed -i 's/^          //' dist/remotemac-relay/README.txt
          tar -C dist -czf dist/taro-relay.tar.gz remotemac-relay
      - name: Try the setup script's relay locally
        run: |
          set -euo pipefail
          B=dist/remotemac-relay/rm-relay-x86_64
          RM_RELAY_KEY=test-key-0123456789 $B 127.0.0.1:47970 2>relay.log &
          sleep 1
          printf '{"session_id":"probe","role":"agent","token":"0123456789abcdef0"}\n' | timeout 3 nc -q 1 127.0.0.1 47970 | tee reply.txt
          grep -q "ERR not admitted" reply.txt
      - uses: actions/upload-artifact@v4
        with:
          name: taro-relay
          path: dist/taro-relay.tar.gz

  test:
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unit and end-to-end tests (protocol, encryption, relay, viewer logic)
        run: cargo test --workspace

  publish:
    needs: [test, mac, windows, relay]
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          cat > notes.md <<'MD'
          ## Downloads

          | File | For |
          |---|---|
          | `Taro-Setup.exe` | Windows 10/11 x64: installs Taro for you (no administrator); it updates itself after that |
          | `Taro-windows.zip` | the same `Taro.exe`, without installing |
          | `Taro-macos.tar.gz` | macOS 14+, Apple silicon and Intel: `taro`, `taro.sh`, `taro-update.sh` |
          | `taro-relay.tar.gz` | your own relay server (Linux x86_64 / ARM64), one-command installer |

          **Mac:** `./taro.sh --password YOUR-PASSWORD` shows the ID and the password, then runs in the background
          (`./taro --stop` ends it); `./taro-update.sh` updates it in place. **Windows:** run `Taro-Setup.exe`, open Taro,
          then either **By ID** (the ID and the password: found on this network, or through the relay) or **By Address**
          (the Mac's IP address or name and the password: straight to the Mac, no relay). Settings > About this Taro
          shows the version and updates it.

          ## Highlights

          - Each Mac app as its own native Windows window; the whole Mac Desktop over GameStream (Moonlight's core),
            with a floating navigation ball.
          - On the same network the PC finds the Mac by its ID and connects straight to it; from elsewhere through a
            relay (these builds come with one; your own is one command away). The relay hands out unique Mac IDs.
          - End-to-end encryption: a password-authenticated key exchange, then ChaCha20-Poly1305 on everything; the
            relay never learns the password or the content.
          - Low latency: UDP with FEC, adaptive bitrate, a direct peer-to-peer path when the networks allow.
          - No logs unless asked for (`--logs-enabled`).

          Both sides must run the same version. If you run your own relay, update it with the new
          `taro-relay.tar.gz` as well. See the [user guide](../../blob/HEAD/docs/USER-GUIDE.md).
          MD
          sed -i 's/^          //' notes.md
          # this version's part of the changelog
          V="${VERSION#v}"
          awk -v v="## $V" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > changes.md || true
          if [ -s changes.md ]; then { echo; echo "## What's new in $V"; cat changes.md; } >> notes.md; fi
          # a version with a suffix (1.2.0-beta.1) is a pre-release; a plain one the latest release
          if [[ "$V" == *-* ]]; then KIND=--prerelease; else KIND=--latest; fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Taro $V" --notes-file notes.md $KIND \
            dist/Taro-Setup.exe dist/Taro-macos.tar.gz dist/Taro-windows.zip dist/taro-relay.tar.gz
