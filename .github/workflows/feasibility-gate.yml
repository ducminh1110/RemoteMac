name: Feasibility Gate (macOS runner)

# Answers, empirically, whether the architecture is possible on a GitHub-hosted
# macOS runner: GUI session, per-window capture, input injection, encoder.
# Triggers: manual (once this file is on the default branch) and pushes to the
# working branch touching the probe, so it can be iterated without a merge.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (e.g. macos-15, macos-15-intel, macos-26)"
        default: "macos-15"
        required: true
  push:
    branches: [claude/inspiring-einstein-er2d37]
    paths: [probe/**, scripts/run-feasibility-probe.sh, .github/workflows/feasibility-gate.yml]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.runner)) || fromJSON('["macos-15","macos-15-intel","macos-26"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run feasibility probe
        run: ./scripts/run-feasibility-probe.sh
      - name: Collect system facts
        if: always()
        run: |
          mkdir -p out
          { sw_vers; uname -a; id; echo; launchctl managername 2>&1; echo; ps -ax -o pid,comm | grep -Ei 'WindowServer|loginwindow|Finder' | head; } > out/system.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feasibility-${{ matrix.runner }}
          path: out/
